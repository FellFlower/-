<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>推箱子工具箱：路径复现 + 地图编辑</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --border: #d1d5db;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      --switcher-width: 168px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #dbeafe, transparent 34%), var(--bg);
      color: var(--text);
    }

    .workspace {
      position: fixed;
      left: 0;
      top: 0;
      right: var(--switcher-width);
      bottom: 0;
      background: var(--bg);
    }

    .tool-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: var(--bg);
    }

    .tool-frame.active {
      display: block;
    }

    .switcher {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--switcher-width);
      height: 100vh;
      padding: 16px 12px;
      background: rgba(255, 255, 255, 0.94);
      border-left: 1px solid rgba(209, 213, 219, 0.9);
      box-shadow: -10px 0 28px rgba(15, 23, 42, 0.1);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .switcher-title {
      margin: 2px 4px 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .switcher-subtitle {
      margin: -4px 4px 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .switch-btn {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 13px 10px;
      cursor: pointer;
      text-align: left;
      background: #f8fafc;
      color: var(--text);
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }

    .switch-btn:hover {
      transform: translateY(-1px);
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .switch-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);
    }

    .switch-btn strong {
      display: block;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 900;
    }

    .switch-btn span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .switcher-footer {
      margin-top: auto;
      padding: 10px 8px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .reload-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 10px 8px;
      font-weight: 800;
      cursor: pointer;
      background: #475569;
      color: white;
      margin-top: 4px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .reload-btn:hover {
      transform: translateY(-1px);
      opacity: 0.94;
    }

    @media (max-width: 780px) {
      :root { --switcher-width: 116px; }

      .switcher {
        padding: 10px 8px;
      }

      .switcher-title {
        font-size: 15px;
      }

      .switcher-subtitle,
      .switcher-footer {
        font-size: 11px;
      }

      .switch-btn {
        padding: 10px 8px;
        border-radius: 13px;
      }

      .switch-btn strong {
        font-size: 12px;
      }

      .switch-btn span {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="workspace" aria-label="推箱子工具页面">
    <iframe id="replayFrame" class="tool-frame active" title="路径复现与手动模式"></iframe>
    <iframe id="editorFrame" class="tool-frame" title="地图生成与格式转换"></iframe>
  </main>

  <aside class="switcher" aria-label="功能切换界面">
    <h1 class="switcher-title">功能切换</h1>
    <p class="switcher-subtitle">右侧切换两个页面，状态会保留。</p>

    <button id="showReplayBtn" class="switch-btn active" type="button" data-page="replay">
      <strong>路径复现</strong>
      <span>自动复现、手动模式、撤销、路径记录</span>
    </button>

    <button id="showEditorBtn" class="switch-btn" type="button" data-page="editor">
      <strong>地图生成</strong>
      <span>绘制地图、导入导出、格式互转</span>
    </button>

    <button id="reloadCurrentBtn" class="reload-btn" type="button">刷新当前页</button>

    <div class="switcher-footer">
      两个功能已合并在同一个 HTML 文件中；切换只是隐藏/显示页面，不会互相影响脚本。
    </div>
  </aside>

  <script>
    const embeddedPages = {
      replay: "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>推箱子路径复现器<\/title>\n  <style>\n    :root {\n      --bg: #f5f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --empty: #60a5fa;\n      --wall: #6b7280;\n      --car: #22c55e;\n      --box: #facc15;\n      --target: #f9a8d4;\n      --bomb: #ef4444;\n      --shadow: 0 12px 32px rgba(15, 23, 42, 0.12);\n    }\n\n    * { box-sizing: border-box; }\n\n    body {\n      margin: 0;\n      min-height: 100vh;\n      font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      background: radial-gradient(circle at top left, #dbeafe, transparent 34%), var(--bg);\n      color: var(--text);\n    }\n\n    .app {\n      max-width: 1240px;\n      margin: 0 auto;\n      padding: 28px 20px 40px;\n    }\n\n    header { margin-bottom: 18px; }\n\n    h1 {\n      margin: 0 0 8px;\n      font-size: 30px;\n      letter-spacing: -0.04em;\n    }\n\n    .subtitle {\n      margin: 0;\n      color: var(--muted);\n      font-size: 15px;\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: minmax(560px, 1fr) 450px;\n      gap: 20px;\n      align-items: start;\n    }\n\n    .panel {\n      background: rgba(255, 255, 255, 0.92);\n      border: 1px solid rgba(209, 213, 219, 0.8);\n      border-radius: 22px;\n      box-shadow: var(--shadow);\n      padding: 18px;\n      backdrop-filter: blur(12px);\n    }\n\n    .map-wrap {\n      overflow-x: auto;\n      padding-bottom: 4px;\n    }\n\n    .grid {\n      display: grid;\n      grid-template-columns: repeat(16, 34px);\n      grid-template-rows: repeat(12, 34px);\n      gap: 3px;\n      user-select: none;\n      width: max-content;\n      padding: 8px;\n      border-radius: 18px;\n      background: #e5e7eb;\n      border: 1px solid #cbd5e1;\n    }\n\n    .cell {\n      width: 34px;\n      height: 34px;\n      border: 1px solid rgba(15, 23, 42, 0.18);\n      border-radius: 7px;\n      position: relative;\n      overflow: hidden;\n    }\n\n    .tile-empty { background: var(--empty); }\n    .tile-wall { background: var(--wall); }\n    .tile-target { background: var(--target); }\n\n    .object-car::after,\n    .object-box::after,\n    .object-bomb::after {\n      content: \"\";\n      position: absolute;\n      left: 6px;\n      right: 6px;\n      top: 6px;\n      bottom: 6px;\n      border-radius: 6px;\n      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.25);\n      z-index: 1;\n    }\n\n    .object-car::after { background: var(--car); }\n    .object-box::after { background: var(--box); }\n    .object-bomb::after { background: var(--bomb); }\n\n    .badge {\n      position: absolute;\n      z-index: 3;\n      padding: 1px 3px;\n      border-radius: 999px;\n      font-size: 9px;\n      line-height: 1.1;\n      font-weight: 900;\n      color: #111827;\n      background: rgba(255, 255, 255, 0.86);\n      border: 1px solid rgba(15, 23, 42, 0.2);\n      pointer-events: none;\n    }\n\n    .box-badge { left: 2px; top: 2px; }\n    .target-badge { right: 2px; bottom: 2px; }\n\n    .cell.flash {\n      outline: 3px solid #ef4444;\n      filter: brightness(1.18);\n    }\n\n    .section-title {\n      margin: 0 0 10px;\n      font-size: 16px;\n      font-weight: 800;\n    }\n\n    .buttons {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px;\n      margin: 12px 0 16px;\n    }\n\n    button {\n      border: 0;\n      border-radius: 12px;\n      padding: 10px 13px;\n      font-weight: 800;\n      cursor: pointer;\n      background: #2563eb;\n      color: white;\n      transition: transform 0.12s ease, opacity 0.12s ease;\n    }\n\n    button:hover:not(:disabled) {\n      transform: translateY(-1px);\n      opacity: 0.94;\n    }\n\n    button:disabled {\n      opacity: 0.55;\n      cursor: not-allowed;\n    }\n\n    button.secondary { background: #475569; }\n    button.danger { background: #dc2626; }\n    button.good { background: #16a34a; }\n\n    textarea,\n    input[type=\"text\"],\n    select {\n      width: 100%;\n      border: 1px solid #cbd5e1;\n      border-radius: 16px;\n      padding: 12px;\n      font-family: Consolas, Monaco, \"Courier New\", monospace;\n      font-size: 14px;\n      line-height: 1.55;\n      outline: none;\n      color: #111827;\n      background: #f8fafc;\n    }\n\n    textarea:focus,\n    input[type=\"text\"]:focus,\n    select:focus {\n      border-color: #2563eb;\n      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);\n    }\n\n    textarea {\n      min-height: 210px;\n      resize: vertical;\n    }\n\n    #pathInput {\n      min-height: 54px;\n      resize: vertical;\n    }\n\n    .status {\n      min-height: 22px;\n      margin: 8px 0 0;\n      color: var(--muted);\n      font-size: 14px;\n      line-height: 1.6;\n    }\n\n    .status.ok { color: #15803d; }\n    .status.err { color: #dc2626; }\n    .status.warn { color: #b45309; }\n\n    .hint {\n      margin: 10px 0 0;\n      color: var(--muted);\n      font-size: 13px;\n      line-height: 1.6;\n    }\n\n    .legend {\n      display: grid;\n      grid-template-columns: repeat(6, max-content);\n      gap: 8px 12px;\n      align-items: center;\n      margin: 14px 0 0;\n      color: var(--muted);\n      font-size: 13px;\n    }\n\n    .legend-item {\n      display: inline-flex;\n      align-items: center;\n      gap: 5px;\n    }\n\n    .mini {\n      width: 15px;\n      height: 15px;\n      border-radius: 4px;\n      border: 1px solid rgba(0,0,0,0.15);\n    }\n\n    .controls-row {\n      display: grid;\n      grid-template-columns: 1fr 92px;\n      gap: 10px;\n      align-items: center;\n      margin-top: 12px;\n    }\n\n    .speed-box {\n      display: grid;\n      gap: 6px;\n      color: var(--muted);\n      font-size: 13px;\n    }\n\n    input[type=\"range\"] { width: 100%; }\n\n    .switch-line {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      margin-top: 10px;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 10px;\n      margin-top: 14px;\n    }\n\n    .stat-card {\n      background: #f8fafc;\n      border: 1px solid #e2e8f0;\n      border-radius: 14px;\n      padding: 10px;\n    }\n\n    .stat-label {\n      color: var(--muted);\n      font-size: 12px;\n    }\n\n    .stat-value {\n      font-size: 20px;\n      font-weight: 900;\n      margin-top: 2px;\n    }\n\n    .mapping-panel {\n      display: grid;\n      gap: 8px;\n      margin: 8px 0 12px;\n    }\n\n    .hidden {\n      display: none !important;\n    }\n\n    .mapping-row {\n      display: grid;\n      grid-template-columns: 150px 1fr;\n      gap: 10px;\n      align-items: center;\n      background: #f8fafc;\n      border: 1px solid #e2e8f0;\n      border-radius: 14px;\n      padding: 9px;\n    }\n\n    .mapping-label {\n      font-size: 13px;\n      color: var(--text);\n      font-weight: 800;\n      line-height: 1.4;\n    }\n\n    .mapping-label small {\n      display: block;\n      color: var(--muted);\n      font-weight: 600;\n    }\n\n    .mapping-warning {\n      background: #fffbeb;\n      border: 1px solid #fde68a;\n      color: #92400e;\n      border-radius: 14px;\n      padding: 10px;\n      font-size: 13px;\n      line-height: 1.55;\n    }\n\n\n    .manual-panel {\n      margin-top: 16px;\n      padding: 14px;\n      border: 1px solid #dbeafe;\n      border-radius: 18px;\n      background: #f8fafc;\n    }\n\n    .manual-head {\n      display: flex;\n      justify-content: space-between;\n      gap: 12px;\n      align-items: flex-start;\n      margin-bottom: 12px;\n    }\n\n    .manual-head .section-title { margin-bottom: 4px; }\n    .manual-hint { margin: 0; }\n    .manual-enable { margin-top: 0; white-space: nowrap; }\n\n    .manual-panel.manual-disabled {\n      border-color: #e5e7eb;\n      background: #f1f5f9;\n    }\n\n    .manual-panel.manual-disabled .manual-pad {\n      opacity: 0.48;\n    }\n\n    .manual-panel.manual-disabled .manual-hint::after {\n      content: \" 当前已关闭，方向键和方向按钮不会移动小车。\";\n      color: #b45309;\n      font-weight: 800;\n    }\n\n    .manual-body {\n      display: grid;\n      grid-template-columns: 150px 1fr;\n      gap: 14px;\n      align-items: start;\n    }\n\n    .manual-pad {\n      display: grid;\n      grid-template-columns: repeat(3, 42px);\n      grid-template-rows: repeat(3, 42px);\n      gap: 7px;\n      justify-content: center;\n      padding: 10px;\n      border-radius: 16px;\n      border: 1px solid #e2e8f0;\n      background: #ffffff;\n    }\n\n    .manual-pad button {\n      width: 42px;\n      height: 42px;\n      padding: 0;\n      border-radius: 12px;\n      font-size: 19px;\n      line-height: 1;\n    }\n\n    #manualUpLeftBtn { grid-column: 1; grid-row: 1; }\n    #manualUpBtn { grid-column: 2; grid-row: 1; }\n    #manualUpRightBtn { grid-column: 3; grid-row: 1; }\n    #manualLeftBtn { grid-column: 1; grid-row: 2; }\n    #manualRightBtn { grid-column: 3; grid-row: 2; }\n    #manualDownLeftBtn { grid-column: 1; grid-row: 3; }\n    #manualDownBtn { grid-column: 2; grid-row: 3; }\n    #manualDownRightBtn { grid-column: 3; grid-row: 3; }\n\n    .manual-label {\n      display: block;\n      margin: 0 0 6px;\n      color: var(--muted);\n      font-size: 13px;\n      font-weight: 700;\n    }\n\n    #manualPathOutput {\n      min-height: 70px;\n      resize: vertical;\n    }\n\n    .manual-buttons { margin-bottom: 0; }\n\n    @media (max-width: 700px) {\n      .manual-head { display: block; }\n      .manual-enable { margin-top: 8px; }\n      .manual-body { grid-template-columns: 1fr; }\n      .manual-pad { width: max-content; }\n    }\n\n\n    @media (max-width: 1040px) {\n      .layout { grid-template-columns: 1fr; }\n      .grid {\n        grid-template-columns: repeat(16, 30px);\n        grid-template-rows: repeat(12, 30px);\n      }\n      .cell {\n        width: 30px;\n        height: 30px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <main class=\"app\">\n    <header>\n      <h1>推箱子路径复现器<\/h1>\n      <p class=\"subtitle\">输入 12×16 地图，再输入路径后点击“开始复现”。支持 U/D/L/R 四向移动，以及 a/b/c/e 四个 45° 斜向指令：a=左上、b=右上、c=右下、e=左下。<\/p>\n    <\/header>\n\n    <section class=\"layout\">\n      <div class=\"panel\">\n        <div class=\"map-wrap\">\n          <div id=\"grid\" class=\"grid\" aria-label=\"12行16列路径复现地图\"><\/div>\n        <\/div>\n\n        <div class=\"legend\">\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--wall)\"><\/i># 墙<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--empty)\"><\/i>- 空地<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--target)\"><\/i>. 目标<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--car)\"><\/i>@ 车<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--box)\"><\/i>$ 箱<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--bomb)\"><\/i>* 炸弹<\/span>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat-card\">\n            <div class=\"stat-label\">当前步数<\/div>\n            <div id=\"stepStat\" class=\"stat-value\">0<\/div>\n          <\/div>\n          <div class=\"stat-card\">\n            <div class=\"stat-label\">路径总长<\/div>\n            <div id=\"totalStat\" class=\"stat-value\">0<\/div>\n          <\/div>\n          <div class=\"stat-card\">\n            <div class=\"stat-label\">当前指令<\/div>\n            <div id=\"cmdStat\" class=\"stat-value\">-<\/div>\n          <\/div>\n        <\/div>\n\n        <div id=\"manualPanel\" class=\"manual-panel\" aria-label=\"手动模式\">\n          <div class=\"manual-head\">\n            <div>\n              <p class=\"section-title\">手动模式<\/p>\n              <p class=\"hint manual-hint\">打开开关后可用方向键控制上下左右，或用 a/b/c/e 控制左上/右上/右下/左下；下方 8 向按钮也可操作。有效移动会自动记录路径。<\/p>\n            <\/div>\n            <label class=\"switch-line manual-enable\">\n              <input id=\"manualModeCheck\" type=\"checkbox\" />\n              启用手动模式\n            <\/label>\n          <\/div>\n\n          <div class=\"manual-body\">\n            <div class=\"manual-pad\" aria-label=\"手动八方向按钮\">\n              <button id=\"manualUpLeftBtn\" class=\"secondary\" type=\"button\" aria-label=\"左上\" title=\"a：左上\">↖<\/button>\n              <button id=\"manualUpBtn\" class=\"secondary\" type=\"button\" aria-label=\"向上\" title=\"U：向上\">↑<\/button>\n              <button id=\"manualUpRightBtn\" class=\"secondary\" type=\"button\" aria-label=\"右上\" title=\"b：右上\">↗<\/button>\n              <button id=\"manualLeftBtn\" class=\"secondary\" type=\"button\" aria-label=\"向左\" title=\"L：向左\">←<\/button>\n              <button id=\"manualRightBtn\" class=\"secondary\" type=\"button\" aria-label=\"向右\" title=\"R：向右\">→<\/button>\n              <button id=\"manualDownLeftBtn\" class=\"secondary\" type=\"button\" aria-label=\"左下\" title=\"e：左下\">↙<\/button>\n              <button id=\"manualDownBtn\" class=\"secondary\" type=\"button\" aria-label=\"向下\" title=\"D：向下\">↓<\/button>\n              <button id=\"manualDownRightBtn\" class=\"secondary\" type=\"button\" aria-label=\"右下\" title=\"c：右下\">↘<\/button>\n            <\/div>\n\n            <div>\n              <label class=\"manual-label\" for=\"manualPathOutput\">路径记录区（可直接复制）<\/label>\n              <textarea id=\"manualPathOutput\" readonly spellcheck=\"false\" placeholder=\"例如：RRUaabbLec\"><\/textarea>\n              <div class=\"buttons manual-buttons\">\n                <button id=\"copyManualPathBtn\" class=\"good\" type=\"button\">复制路径<\/button>\n                <button id=\"undoManualBtn\" class=\"secondary\" type=\"button\">撤销上一步<\/button>\n                <button id=\"resetManualBtn\" class=\"danger\" type=\"button\">重置手动路径<\/button>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <p id=\"status\" class=\"status\">请先输入地图和路径。<\/p>\n      <\/div>\n\n      <aside class=\"panel\">\n        <p class=\"section-title\">地图输入<\/p>\n        <textarea id=\"mapText\" spellcheck=\"false\"><\/textarea>\n\n        <div class=\"buttons\">\n          <button id=\"loadMapBtn\">载入地图<\/button>\n          <button id=\"resetStateBtn\" class=\"secondary\">回到初始状态<\/button>\n          <button id=\"exportStateBtn\" class=\"secondary\">输出当前状态<\/button>\n        <\/div>\n\n        <p class=\"section-title\" style=\"margin-top: 16px;\">路径输入 U/D/L/R + a/b/c/e<\/p>\n        <textarea id=\"pathInput\" spellcheck=\"false\" placeholder=\"例如：RRUabbDLe；a左上 b右上 c右下 e左下\"><\/textarea>\n\n        <p class=\"section-title\">复现模式<\/p>\n        <select id=\"modeSelect\" aria-label=\"复现模式选择\">\n          <option value=\"free\" selected>模式一：箱子和目标点没有对应关系<\/option>\n          <option value=\"mapped\">模式二：箱子和目标点一一对应<\/option>\n        <\/select>\n        <p id=\"modeHint\" class=\"hint\">模式一：任意箱子进入任意目标点时，箱子和该目标点一起消失。<\/p>\n\n        <div id=\"mappingSection\" class=\"hidden\">\n          <p class=\"section-title\" style=\"margin-top: 16px;\">箱子-目标点一一对应（仅模式二）<\/p>\n          <div class=\"buttons\">\n            <button id=\"defaultMappingBtn\" class=\"secondary\">按扫描顺序对应<\/button>\n          <\/div>\n          <div id=\"mappingPanel\" class=\"mapping-panel\"><\/div>\n          <label class=\"switch-line\">\n            <input id=\"showIdCheck\" type=\"checkbox\" checked />\n            在地图上显示 B/T 编号\n          <\/label>\n        <\/div>\n\n        <div class=\"controls-row\">\n          <div class=\"speed-box\">\n            <span>播放速度：<b id=\"speedText\">220ms/步<\/b><\/span>\n            <input id=\"speedRange\" type=\"range\" min=\"50\" max=\"1000\" value=\"220\" step=\"10\" />\n          <\/div>\n          <button id=\"stepBtn\" class=\"secondary\">单步<\/button>\n        <\/div>\n\n        <label class=\"switch-line\">\n          <input id=\"bombExplodeCheck\" type=\"checkbox\" checked />\n          炸弹被推向墙时，清除 3×3 墙块并消失\n        <\/label>\n\n        <div class=\"buttons\">\n          <button id=\"startBtn\" class=\"good\">开始复现<\/button>\n          <button id=\"pauseBtn\" class=\"secondary\">暂停<\/button>\n          <button id=\"stopBtn\" class=\"danger\">停止<\/button>\n        <\/div>\n\n        <p class=\"hint\">模式一适合“无配对”的普通复现：任意箱子进任意目标点都会消除。模式二才使用 B/T 编号和手动对应关系。<\/p>\n      <\/aside>\n    <\/section>\n  <\/main>\n\n  <script>\n    const ROWS = 12;\n    const COLS = 16;\n\n    const DEFAULT_MAP_TEXT = [\n      '        \"################\",',\n      '        \"#-----#-------@#\",',\n      '        \"#-#*#-#-####$--#\",',\n      '        \"#-#-#--------#-#\",',\n      '        \"#-#-#-####*###-#\",',\n      '        \"#-#-#-##-----#-#\",',\n      '        \"#-#-########---#\",',\n      '        \"#-#-----$--#-#-#\",',\n      '        \"#-$--------#-#-#\",',\n      '        \"#-#*-.----.#-#-#\",',\n      '        \"#-#----------#.#\",',\n      '        \"################\",'\n    ].join(String.fromCharCode(10));\n\n    const gridEl = document.getElementById('grid');\n    const mapTextEl = document.getElementById('mapText');\n    const pathInputEl = document.getElementById('pathInput');\n    const statusEl = document.getElementById('status');\n    const loadMapBtn = document.getElementById('loadMapBtn');\n    const resetStateBtn = document.getElementById('resetStateBtn');\n    const exportStateBtn = document.getElementById('exportStateBtn');\n    const modeSelect = document.getElementById('modeSelect');\n    const modeHint = document.getElementById('modeHint');\n    const mappingSection = document.getElementById('mappingSection');\n    const defaultMappingBtn = document.getElementById('defaultMappingBtn');\n    const mappingPanel = document.getElementById('mappingPanel');\n    const showIdCheck = document.getElementById('showIdCheck');\n    const startBtn = document.getElementById('startBtn');\n    const pauseBtn = document.getElementById('pauseBtn');\n    const stopBtn = document.getElementById('stopBtn');\n    const stepBtn = document.getElementById('stepBtn');\n    const speedRange = document.getElementById('speedRange');\n    const speedText = document.getElementById('speedText');\n    const bombExplodeCheck = document.getElementById('bombExplodeCheck');\n    const manualPanel = document.getElementById('manualPanel');\n    const manualModeCheck = document.getElementById('manualModeCheck');\n    const manualUpLeftBtn = document.getElementById('manualUpLeftBtn');\n    const manualUpBtn = document.getElementById('manualUpBtn');\n    const manualUpRightBtn = document.getElementById('manualUpRightBtn');\n    const manualLeftBtn = document.getElementById('manualLeftBtn');\n    const manualRightBtn = document.getElementById('manualRightBtn');\n    const manualDownLeftBtn = document.getElementById('manualDownLeftBtn');\n    const manualDownBtn = document.getElementById('manualDownBtn');\n    const manualDownRightBtn = document.getElementById('manualDownRightBtn');\n    const manualPathOutput = document.getElementById('manualPathOutput');\n    const copyManualPathBtn = document.getElementById('copyManualPathBtn');\n    const undoManualBtn = document.getElementById('undoManualBtn');\n    const resetManualBtn = document.getElementById('resetManualBtn');\n    const stepStat = document.getElementById('stepStat');\n    const totalStat = document.getElementById('totalStat');\n    const cmdStat = document.getElementById('cmdStat');\n\n    let initialState = null;\n    let state = null;\n    let mapping = {};\n    let path = '';\n    let stepIndex = 0;\n    let timer = null;\n    let running = false;\n    let paused = false;\n    let flashCells = [];\n    let manualPath = '';\n    let manualHistory = [];\n\n    const DIRS = {\n      U: { dr: -1, dc: 0 },\n      D: { dr: 1, dc: 0 },\n      L: { dr: 0, dc: -1 },\n      R: { dr: 0, dc: 1 },\n      a: { dr: -1, dc: -1 }, // 左上 45°\n      b: { dr: -1, dc: 1 },  // 右上 45°\n      c: { dr: 1, dc: 1 },   // 右下 45°\n      e: { dr: 1, dc: -1 }   // 左下 45°\n    };\n\n    function makeEmptyState() {\n      const base = [];\n      const targetIds = [];\n      const objects = [];\n      for (let r = 0; r < ROWS; r++) {\n        const baseRow = [];\n        const targetRow = [];\n        const objectRow = [];\n        for (let c = 0; c < COLS; c++) {\n          baseRow.push(r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1 ? '#' : '-');\n          targetRow.push(null);\n          objectRow.push(null);\n        }\n        base.push(baseRow);\n        targetIds.push(targetRow);\n        objects.push(objectRow);\n      }\n      return {\n        base,\n        targetIds,\n        objects,\n        car: { r: 1, c: 1 },\n        boxList: [],\n        targetList: []\n      };\n    }\n\n    function cloneState(src) {\n      return {\n        base: src.base.map(row => row.slice()),\n        targetIds: src.targetIds.map(row => row.slice()),\n        objects: src.objects.map(row => row.map(obj => obj ? { type: obj.type, id: obj.id } : null)),\n        car: { r: src.car.r, c: src.car.c },\n        boxList: src.boxList.map(item => ({ id: item.id, r: item.r, c: item.c, active: item.active !== false })),\n        targetList: src.targetList.map(item => ({ id: item.id, r: item.r, c: item.c, active: item.active !== false }))\n      };\n    }\n\n    function setStatus(message, type) {\n      statusEl.textContent = message;\n      statusEl.className = 'status' + (type ? ' ' + type : '');\n    }\n\n    function getMode() {\n      return modeSelect ? modeSelect.value : 'free';\n    }\n\n    function isMappedMode() {\n      return getMode() === 'mapped';\n    }\n\n    function updateModeUI(showMessage) {\n      const mapped = isMappedMode();\n      if (mappingSection) mappingSection.classList.toggle('hidden', !mapped);\n      if (modeHint) {\n        modeHint.textContent = mapped\n          ? '模式二：只有箱子进入自己绑定的目标点时，箱子和目标点才会一起消失。'\n          : '模式一：任意箱子进入任意目标点时，箱子和该目标点一起消失，不需要设置 B/T 对应关系。';\n      }\n\n      if (mapped) {\n        renderMappingControls();\n        if (showMessage) setStatus('已切换到模式二：箱子必须进入绑定目标点才会消失。', 'ok');\n      } else {\n        if (showMessage) setStatus('已切换到模式一：箱子进入任意目标点都会消失。', 'ok');\n      }\n      renderGrid();\n    }\n\n    function normalizeMapLine(line) {\n      const trimmed = line.trim();\n\n      const doubleStart = trimmed.indexOf('\"');\n      const doubleEnd = trimmed.lastIndexOf('\"');\n      if (doubleStart !== -1 && doubleEnd > doubleStart) {\n        return trimmed.slice(doubleStart + 1, doubleEnd).replaceAll(' ', '-');\n      }\n\n      const singleStart = trimmed.indexOf(\"'\");\n      const singleEnd = trimmed.lastIndexOf(\"'\");\n      if (singleStart !== -1 && singleEnd > singleStart) {\n        return trimmed.slice(singleStart + 1, singleEnd).replaceAll(' ', '-');\n      }\n\n      if (line.length === COLS) return line.replaceAll(' ', '-');\n      return trimmed.replaceAll(' ', '-');\n    }\n\n    function isValidMapLine(line) {\n      if (line.length !== COLS) return false;\n      for (let i = 0; i < line.length; i++) {\n        if (!'#@$.-*'.includes(line[i])) return false;\n      }\n      return true;\n    }\n\n    function parseMapText(raw) {\n      const text = raw.replaceAll(String.fromCharCode(13), '');\n      const lines = text.split(String.fromCharCode(10));\n      const extracted = [];\n\n      for (const line of lines) {\n        if (line.trim().length === 0) continue;\n        const candidate = normalizeMapLine(line);\n        if (isValidMapLine(candidate)) extracted.push(candidate);\n      }\n\n      if (extracted.length !== ROWS) {\n        return { ok: false, error: '需要识别到 ' + ROWS + ' 行地图，目前识别到 ' + extracted.length + ' 行。' };\n      }\n\n      const nextState = makeEmptyState();\n      let carCount = 0;\n\n      for (let r = 0; r < ROWS; r++) {\n        for (let c = 0; c < COLS; c++) {\n          const ch = extracted[r][c];\n          if (ch === '#') {\n            nextState.base[r][c] = '#';\n          } else if (ch === '.') {\n            const id = nextState.targetList.length;\n            nextState.base[r][c] = '-';\n            nextState.targetIds[r][c] = id;\n            nextState.targetList.push({ id, r, c, active: true });\n          } else if (ch === '@') {\n            nextState.base[r][c] = '-';\n            nextState.car = { r, c };\n            carCount++;\n          } else if (ch === '$') {\n            const id = nextState.boxList.length;\n            nextState.base[r][c] = '-';\n            nextState.objects[r][c] = { type: 'box', id };\n            nextState.boxList.push({ id, r, c, active: true });\n          } else if (ch === '*') {\n            nextState.base[r][c] = '-';\n            nextState.objects[r][c] = { type: 'bomb', id: -1 };\n          } else {\n            nextState.base[r][c] = '-';\n          }\n        }\n      }\n\n      if (carCount !== 1) {\n        return { ok: false, error: '地图中必须且只能有一个车 @，当前识别到 ' + carCount + ' 个。' };\n      }\n\n      return { ok: true, data: nextState };\n    }\n\n    function defaultMappingFromState(src) {\n      mapping = {};\n      if (!src) return;\n      for (const box of src.boxList) {\n        mapping[box.id] = box.id < src.targetList.length ? src.targetList[box.id].id : null;\n      }\n    }\n\n    function targetOptionText(target) {\n      return 'T' + target.id + '  第' + (target.r + 1) + '行 第' + (target.c + 1) + '列';\n    }\n\n    function renderMappingControls() {\n      mappingPanel.innerHTML = '';\n      if (!isMappedMode()) {\n        mappingPanel.innerHTML = '<div class=\"mapping-warning\">模式一不需要设置箱子和目标点对应关系。<\/div>';\n        return;\n      }\n      if (!initialState) {\n        mappingPanel.innerHTML = '<div class=\"mapping-warning\">请先载入地图。<\/div>';\n        return;\n      }\n\n      const boxes = initialState.boxList;\n      const targets = initialState.targetList;\n\n      if (boxes.length === 0 && targets.length === 0) {\n        mappingPanel.innerHTML = '<div class=\"mapping-warning\">当前地图没有箱子和目标点。<\/div>';\n        return;\n      }\n\n      if (boxes.length !== targets.length) {\n        const warn = document.createElement('div');\n        warn.className = 'mapping-warning';\n        warn.textContent = '注意：当前箱子数量为 ' + boxes.length + '，目标点数量为 ' + targets.length + '，无法形成完整一一对应。';\n        mappingPanel.appendChild(warn);\n      }\n\n      for (const box of boxes) {\n        const row = document.createElement('div');\n        row.className = 'mapping-row';\n\n        const label = document.createElement('div');\n        label.className = 'mapping-label';\n        label.innerHTML = 'B' + box.id + ' 箱子<small>第' + (box.r + 1) + '行 第' + (box.c + 1) + '列<\/small>';\n\n        const select = document.createElement('select');\n        const emptyOption = document.createElement('option');\n        emptyOption.value = '';\n        emptyOption.textContent = '未设置';\n        select.appendChild(emptyOption);\n\n        for (const target of targets) {\n          const option = document.createElement('option');\n          option.value = String(target.id);\n          option.textContent = targetOptionText(target);\n          select.appendChild(option);\n        }\n\n        const current = mapping[box.id];\n        select.value = current === null || current === undefined ? '' : String(current);\n        select.addEventListener('change', () => {\n          mapping[box.id] = select.value === '' ? null : Number(select.value);\n          validateMapping(false);\n          renderGrid();\n        });\n\n        row.appendChild(label);\n        row.appendChild(select);\n        mappingPanel.appendChild(row);\n      }\n\n      validateMapping(false);\n    }\n\n    function validateMapping(showMessage) {\n      if (!initialState) return false;\n\n      if (!isMappedMode()) {\n        if (showMessage) setStatus('模式一无需设置对应关系，可以直接复现路径。', 'ok');\n        return true;\n      }\n\n      const boxes = initialState.boxList;\n      const targets = initialState.targetList;\n      if (boxes.length !== targets.length) {\n        if (showMessage) setStatus('箱子和目标点数量不同，不能进行一一对应复现。', 'err');\n        return false;\n      }\n\n      const targetSet = new Set(targets.map(t => t.id));\n      const used = new Set();\n\n      for (const box of boxes) {\n        const tid = mapping[box.id];\n        if (tid === null || tid === undefined || !targetSet.has(tid)) {\n          if (showMessage) setStatus('B' + box.id + ' 还没有设置对应目标点。', 'err');\n          return false;\n        }\n        if (used.has(tid)) {\n          if (showMessage) setStatus('目标点 T' + tid + ' 被多个箱子重复绑定，请保证一一对应。', 'err');\n          return false;\n        }\n        used.add(tid);\n      }\n\n      if (showMessage) setStatus('箱子-目标点对应关系有效。', 'ok');\n      return true;\n    }\n\n    function renderGrid() {\n      gridEl.innerHTML = '';\n      if (!state) return;\n\n      const showIds = showIdCheck.checked && isMappedMode();\n\n      for (let r = 0; r < ROWS; r++) {\n        for (let c = 0; c < COLS; c++) {\n          const cell = document.createElement('div');\n          const hasTarget = state.targetIds[r][c] !== null;\n          let cls = 'cell ' + (state.base[r][c] === '#' ? 'tile-wall' : hasTarget ? 'tile-target' : 'tile-empty');\n\n          const obj = state.objects[r][c];\n          if (obj && obj.type === 'box') cls += ' object-box';\n          if (obj && obj.type === 'bomb') cls += ' object-bomb';\n          if (state.car.r === r && state.car.c === c) cls += ' object-car';\n          if (flashCells.some(p => p.r === r && p.c === c)) cls += ' flash';\n\n          cell.className = cls;\n\n          if (showIds && hasTarget) {\n            const targetBadge = document.createElement('span');\n            targetBadge.className = 'badge target-badge';\n            targetBadge.textContent = 'T' + state.targetIds[r][c];\n            cell.appendChild(targetBadge);\n          }\n\n          if (showIds && obj && obj.type === 'box') {\n            const boxBadge = document.createElement('span');\n            boxBadge.className = 'badge box-badge';\n            boxBadge.textContent = 'B' + obj.id;\n            cell.appendChild(boxBadge);\n          }\n\n          gridEl.appendChild(cell);\n        }\n      }\n\n      updateStats();\n    }\n\n    function updateStats() {\n      stepStat.textContent = String(stepIndex);\n      totalStat.textContent = String(path.length);\n      cmdStat.textContent = stepIndex < path.length ? path[stepIndex] : '-';\n    }\n\n    function cleanPath(raw) {\n      let result = '';\n      for (let i = 0; i < raw.length; i++) {\n        const ch = raw[i];\n        const upper = ch.toUpperCase();\n        if (upper === 'U' || upper === 'D' || upper === 'L' || upper === 'R') result += upper;\n        else if ('abce'.includes(ch.toLowerCase())) result += ch.toLowerCase();\n      }\n      return result;\n    }\n\n\n    function isManualModeEnabled() {\n      return !!(manualModeCheck && manualModeCheck.checked);\n    }\n\n    function updateManualModeSwitchUI(showMessage) {\n      const enabled = isManualModeEnabled();\n      if (manualPanel) manualPanel.classList.toggle('manual-disabled', !enabled);\n\n      const moveButtons = [manualUpLeftBtn, manualUpBtn, manualUpRightBtn, manualLeftBtn, manualRightBtn, manualDownLeftBtn, manualDownBtn, manualDownRightBtn];\n      for (const btn of moveButtons) {\n        btn.disabled = !enabled;\n        btn.title = enabled ? '' : '请先开启手动模式';\n      }\n\n      if (showMessage) {\n        setStatus(\n          enabled\n            ? '手动模式已开启：方向键控制四向，a/b/c/e 控制四个 45° 斜向。'\n            : '手动模式已关闭：键盘和方向按钮不会移动小车，可防止误触。',\n          enabled ? 'ok' : 'warn'\n        );\n      }\n    }\n\n    function updateManualRecordUI() {\n      manualPathOutput.value = manualPath;\n      undoManualBtn.disabled = manualHistory.length === 0;\n      copyManualPathBtn.disabled = manualPath.length === 0;\n      resetManualBtn.disabled = manualPath.length === 0 && manualHistory.length === 0;\n    }\n\n    function clearManualRecord() {\n      manualPath = '';\n      manualHistory = [];\n      updateManualRecordUI();\n    }\n\n    function directionName(cmd) {\n      if (cmd === 'U') return '上';\n      if (cmd === 'D') return '下';\n      if (cmd === 'L') return '左';\n      if (cmd === 'R') return '右';\n      if (cmd === 'a') return '左上';\n      if (cmd === 'b') return '右上';\n      if (cmd === 'c') return '右下';\n      if (cmd === 'e') return '左下';\n      return cmd;\n    }\n\n    function doManualStep(cmd) {\n      if (!state) {\n        setStatus('请先载入地图。', 'err');\n        return false;\n      }\n\n      const dir = DIRS[cmd];\n      if (!dir) {\n        setStatus('手动指令无效，只支持 U/D/L/R 和 a/b/c/e。', 'err');\n        return false;\n      }\n\n      const nr = state.car.r + dir.dr;\n      const nc = state.car.c + dir.dc;\n      const stepText = '手动' + directionName(cmd) + '移';\n\n      if (!inBounds(nr, nc)) {\n        setStatus(stepText + '越界，位置不变。', 'err');\n        return false;\n      }\n\n      const obj = state.objects[nr][nc];\n\n      if (!obj) {\n        if (state.base[nr][nc] === '#') {\n          flash([{ r: nr, c: nc }]);\n          setStatus(stepText + '撞墙，位置不变。', 'err');\n          return false;\n        }\n        state.car = { r: nr, c: nc };\n        renderGrid();\n        setStatus(stepText + '成功，路径已记录。', 'ok');\n        return true;\n      }\n\n      if (obj.type === 'box' || obj.type === 'bomb') {\n        const br = nr + dir.dr;\n        const bc = nc + dir.dc;\n\n        if (!inBounds(br, bc)) {\n          setStatus(stepText + '推动物体越界，位置不变。', 'err');\n          return false;\n        }\n\n        if (state.objects[br][bc]) {\n          flash([{ r: br, c: bc }]);\n          setStatus(stepText + '失败：前方还有另一个物体。', 'err');\n          return false;\n        }\n\n        if (state.base[br][bc] === '#') {\n          if (obj.type === 'bomb' && bombExplodeCheck.checked) {\n            state.objects[nr][nc] = null;\n            state.car = { r: nr, c: nc };\n            const changed = explodeBombAtWall(br, bc);\n            flash(changed.concat([{ r: nr, c: nc }]));\n            setStatus(stepText + '成功：炸弹撞墙爆炸，清除 ' + changed.length + ' 个墙块，路径已记录。', 'warn');\n            return true;\n          }\n\n          flash([{ r: br, c: bc }]);\n          setStatus(stepText + '失败：推箱/炸弹撞墙。', 'err');\n          return false;\n        }\n\n        state.objects[nr][nc] = null;\n        state.car = { r: nr, c: nc };\n\n        const consumedTargetId = obj.type === 'box' ? consumeIfMatchedBox(obj, br, bc) : null;\n        if (consumedTargetId !== null) {\n          flash([{ r: br, c: bc }, { r: nr, c: nc }]);\n          const consumeText = isMappedMode()\n            ? '进入对应目标 T' + consumedTargetId\n            : '进入目标 T' + consumedTargetId;\n          setStatus(stepText + '成功：B' + obj.id + ' ' + consumeText + '，箱子和目标点一起消失，路径已记录。', 'ok');\n          return true;\n        }\n\n        state.objects[br][bc] = obj;\n        renderGrid();\n        setStatus(stepText + '成功，路径已记录。', 'ok');\n        return true;\n      }\n\n      setStatus(stepText + '失败：遇到未知物体。', 'err');\n      return false;\n    }\n\n    function applyManualMove(cmd) {\n      if (!isManualModeEnabled()) {\n        setStatus('请先打开“启用手动模式”开关，避免误触。', 'warn');\n        return;\n      }\n      if (!state && !loadMap()) return;\n      if (!validateMapping(true)) return;\n      if (running) stopRun(false);\n\n      const before = cloneState(state);\n      const ok = doManualStep(cmd);\n      if (!ok) return;\n\n      manualHistory.push(before);\n      manualPath += cmd;\n      updateManualRecordUI();\n    }\n\n    function undoManualStep() {\n      if (manualHistory.length === 0) {\n        setStatus('没有可以撤销的手动步骤。', 'warn');\n        return;\n      }\n      if (running) stopRun(false);\n      state = manualHistory.pop();\n      manualPath = manualPath.slice(0, -1);\n      updateManualRecordUI();\n      renderGrid();\n      setStatus('已撤销上一步，路径记录区已同步。', 'ok');\n    }\n\n    function resetManualMode() {\n      if (running) stopRun(false);\n      if (!initialState) {\n        setStatus('还没有初始地图，请先载入地图。', 'err');\n        return;\n      }\n      state = cloneState(initialState);\n      stepIndex = 0;\n      clearManualRecord();\n      renderGrid();\n      setStatus('手动模式已重置：小车回到原点，路径记录区已清零。', 'ok');\n    }\n\n    function copyManualPath() {\n      if (manualPath.length === 0) {\n        setStatus('路径记录区为空，暂无可复制内容。', 'warn');\n        return;\n      }\n\n      const fallbackCopy = () => {\n        manualPathOutput.focus();\n        manualPathOutput.select();\n        document.execCommand('copy');\n        manualPathOutput.setSelectionRange(manualPath.length, manualPath.length);\n        setStatus('路径已复制到剪贴板。', 'ok');\n      };\n\n      if (navigator.clipboard && window.isSecureContext) {\n        navigator.clipboard.writeText(manualPath)\n          .then(() => setStatus('路径已复制到剪贴板。', 'ok'))\n          .catch(fallbackCopy);\n      } else {\n        fallbackCopy();\n      }\n    }\n\n    function shouldIgnoreManualKeyEvent(event) {\n      const active = document.activeElement;\n      if (!active) return false;\n      const tag = active.tagName;\n      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;\n      if (active.isContentEditable) return true;\n      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return true;\n      return false;\n    }\n\n    function inBounds(r, c) {\n      return r >= 0 && r < ROWS && c >= 0 && c < COLS;\n    }\n\n    function flash(list) {\n      flashCells = list;\n      renderGrid();\n      setTimeout(() => {\n        flashCells = [];\n        renderGrid();\n      }, 170);\n    }\n\n    function explodeBombAtWall(wallR, wallC) {\n      const changed = [];\n      for (let rr = wallR - 1; rr <= wallR + 1; rr++) {\n        for (let cc = wallC - 1; cc <= wallC + 1; cc++) {\n          if (!inBounds(rr, cc)) continue;\n          if (rr === 0 || rr === ROWS - 1 || cc === 0 || cc === COLS - 1) continue;\n          if (state.base[rr][cc] === '#') {\n            state.base[rr][cc] = '-';\n            changed.push({ r: rr, c: cc });\n          }\n        }\n      }\n      return changed;\n    }\n\n    function consumeIfMatchedBox(boxObj, targetR, targetC) {\n      const targetId = state.targetIds[targetR][targetC];\n      if (targetId === null || targetId === undefined) return null;\n      if (isMappedMode() && mapping[boxObj.id] !== targetId) return null;\n\n      state.targetIds[targetR][targetC] = null;\n      if (state.targetList[targetId]) state.targetList[targetId].active = false;\n      if (state.boxList[boxObj.id]) state.boxList[boxObj.id].active = false;\n      return targetId;\n    }\n\n    function doOneStep() {\n      if (!state) {\n        setStatus('请先载入地图。', 'err');\n        return false;\n      }\n\n      if (stepIndex >= path.length) {\n        setStatus('路径已经复现完成。', 'ok');\n        return false;\n      }\n\n      const cmd = path[stepIndex];\n      const dir = DIRS[cmd];\n      const nr = state.car.r + dir.dr;\n      const nc = state.car.c + dir.dc;\n\n      if (!inBounds(nr, nc)) {\n        setStatus('第 ' + (stepIndex + 1) + ' 步 ' + cmd + ' 越界，复现停止。', 'err');\n        stopRun(false);\n        return false;\n      }\n\n      const obj = state.objects[nr][nc];\n\n      if (!obj) {\n        if (state.base[nr][nc] === '#') {\n          setStatus('第 ' + (stepIndex + 1) + ' 步 ' + cmd + ' 撞墙，复现停止。', 'err');\n          stopRun(false);\n          return false;\n        }\n        state.car = { r: nr, c: nc };\n        stepIndex++;\n        renderGrid();\n        return true;\n      }\n\n      if (obj.type === 'box' || obj.type === 'bomb') {\n        const br = nr + dir.dr;\n        const bc = nc + dir.dc;\n\n        if (!inBounds(br, bc)) {\n          setStatus('第 ' + (stepIndex + 1) + ' 步 ' + cmd + ' 推动物体越界，复现停止。', 'err');\n          stopRun(false);\n          return false;\n        }\n\n        if (state.objects[br][bc]) {\n          setStatus('第 ' + (stepIndex + 1) + ' 步 ' + cmd + ' 试图把物体推到另一个物体上，复现停止。', 'err');\n          stopRun(false);\n          return false;\n        }\n\n        if (state.base[br][bc] === '#') {\n          if (obj.type === 'bomb' && bombExplodeCheck.checked) {\n            state.objects[nr][nc] = null;\n            state.car = { r: nr, c: nc };\n            const changed = explodeBombAtWall(br, bc);\n            stepIndex++;\n            flash(changed.concat([{ r: nr, c: nc }]));\n            setStatus('第 ' + stepIndex + ' 步：炸弹撞墙爆炸，清除 ' + changed.length + ' 个墙块。', 'warn');\n            return true;\n          }\n\n          setStatus('第 ' + (stepIndex + 1) + ' 步 ' + cmd + ' 推箱/炸弹撞墙，复现停止。', 'err');\n          stopRun(false);\n          return false;\n        }\n\n        state.objects[nr][nc] = null;\n        state.car = { r: nr, c: nc };\n\n        const consumedTargetId = obj.type === 'box' ? consumeIfMatchedBox(obj, br, bc) : null;\n        if (consumedTargetId !== null) {\n          stepIndex++;\n          flash([{ r: br, c: bc }, { r: nr, c: nc }]);\n          const consumeText = isMappedMode()\n            ? '进入对应目标 T' + consumedTargetId\n            : '进入目标 T' + consumedTargetId;\n          setStatus('第 ' + stepIndex + ' 步：B' + obj.id + ' ' + consumeText + '，箱子和目标点一起消失。', 'ok');\n          return true;\n        }\n\n        state.objects[br][bc] = obj;\n        stepIndex++;\n        renderGrid();\n        return true;\n      }\n\n      setStatus('第 ' + (stepIndex + 1) + ' 步遇到未知物体，复现停止。', 'err');\n      stopRun(false);\n      return false;\n    }\n\n    function preparePath() {\n      path = cleanPath(pathInputEl.value);\n      pathInputEl.value = path;\n      stepIndex = 0;\n      updateStats();\n\n      if (path.length === 0) {\n        setStatus('路径为空，请输入 U/D/L/R 或 a/b/c/e。', 'err');\n        return false;\n      }\n      return true;\n    }\n\n    function loadMap() {\n      const result = parseMapText(mapTextEl.value);\n      if (!result.ok) {\n        setStatus(result.error, 'err');\n        return false;\n      }\n\n      stopRun(false);\n      initialState = cloneState(result.data);\n      state = cloneState(result.data);\n      defaultMappingFromState(initialState);\n      renderMappingControls();\n      stepIndex = 0;\n      path = cleanPath(pathInputEl.value);\n      pathInputEl.value = path;\n      clearManualRecord();\n      updateModeUI(false);\n      renderGrid();\n      setStatus(isMappedMode()\n        ? '地图已载入，并已按扫描顺序生成默认对应关系。'\n        : '地图已载入，当前为模式一：箱子进入任意目标点都会消失。', 'ok');\n      return true;\n    }\n\n    function tick() {\n      if (!running || paused) return;\n      const ok = doOneStep();\n      if (!ok || stepIndex >= path.length) {\n        if (stepIndex >= path.length) setStatus('路径复现完成，总步数：' + stepIndex + '。', 'ok');\n        stopRun(false);\n      }\n    }\n\n    function startTimer() {\n      clearInterval(timer);\n      timer = setInterval(tick, Number(speedRange.value));\n    }\n\n    function startRun() {\n      if (!state && !loadMap()) return;\n      if (!validateMapping(true)) return;\n      if (!preparePath()) return;\n\n      clearManualRecord();\n      state = cloneState(initialState);\n      stepIndex = 0;\n      running = true;\n      paused = false;\n      pauseBtn.textContent = '暂停';\n      renderGrid();\n      setStatus('开始复现路径。', 'ok');\n      startTimer();\n    }\n\n    function stopRun(resetToInitial) {\n      clearInterval(timer);\n      timer = null;\n      running = false;\n      paused = false;\n      pauseBtn.textContent = '暂停';\n      if (resetToInitial && initialState) {\n        state = cloneState(initialState);\n        stepIndex = 0;\n        clearManualRecord();\n        renderGrid();\n        setStatus('已停止并回到初始状态，手动路径记录已清零。', 'ok');\n      }\n      updateStats();\n    }\n\n    function resetState() {\n      stopRun(false);\n      if (!initialState) {\n        setStatus('还没有初始地图，请先载入地图。', 'err');\n        return;\n      }\n      state = cloneState(initialState);\n      stepIndex = 0;\n      clearManualRecord();\n      renderGrid();\n      setStatus('已回到初始状态，手动路径记录已清零。', 'ok');\n    }\n\n    function exportCurrentState() {\n      if (!state) return;\n      const lines = [];\n      for (let r = 0; r < ROWS; r++) {\n        let row = '';\n        for (let c = 0; c < COLS; c++) {\n          const obj = state.objects[r][c];\n          if (state.car.r === r && state.car.c === c) row += '@';\n          else if (obj && obj.type === 'box') row += '$';\n          else if (obj && obj.type === 'bomb') row += '*';\n          else if (state.base[r][c] === '#') row += '#';\n          else if (state.targetIds[r][c] !== null) row += '.';\n          else row += '-';\n        }\n        lines.push('        \"' + row + '\",');\n      }\n      mapTextEl.value = lines.join(String.fromCharCode(10));\n      setStatus('已输出当前状态到地图输入框。', 'ok');\n    }\n\n    modeSelect.addEventListener('change', () => {\n      stopRun(false);\n      if (initialState) {\n        state = cloneState(initialState);\n        stepIndex = 0;\n        clearManualRecord();\n      }\n      updateModeUI(true);\n    });\n\n    loadMapBtn.addEventListener('click', loadMap);\n    resetStateBtn.addEventListener('click', resetState);\n    exportStateBtn.addEventListener('click', exportCurrentState);\n    startBtn.addEventListener('click', startRun);\n    stopBtn.addEventListener('click', () => stopRun(true));\n    showIdCheck.addEventListener('change', renderGrid);\n\n    manualUpLeftBtn.addEventListener('click', () => applyManualMove('a'));\n    manualUpBtn.addEventListener('click', () => applyManualMove('U'));\n    manualUpRightBtn.addEventListener('click', () => applyManualMove('b'));\n    manualLeftBtn.addEventListener('click', () => applyManualMove('L'));\n    manualRightBtn.addEventListener('click', () => applyManualMove('R'));\n    manualDownLeftBtn.addEventListener('click', () => applyManualMove('e'));\n    manualDownBtn.addEventListener('click', () => applyManualMove('D'));\n    manualDownRightBtn.addEventListener('click', () => applyManualMove('c'));\n    undoManualBtn.addEventListener('click', undoManualStep);\n    resetManualBtn.addEventListener('click', resetManualMode);\n    copyManualPathBtn.addEventListener('click', copyManualPath);\n    manualModeCheck.addEventListener('change', () => updateManualModeSwitchUI(true));\n\n    document.addEventListener('keydown', (event) => {\n      if (!manualModeCheck.checked || shouldIgnoreManualKeyEvent(event)) return;\n      const keyMap = {\n        ArrowUp: 'U',\n        ArrowDown: 'D',\n        ArrowLeft: 'L',\n        ArrowRight: 'R',\n        a: 'a', A: 'a',\n        b: 'b', B: 'b',\n        c: 'c', C: 'c',\n        e: 'e', E: 'e'\n      };\n      const cmd = keyMap[event.key];\n      if (!cmd) return;\n      event.preventDefault();\n      applyManualMove(cmd);\n    });\n\n    defaultMappingBtn.addEventListener('click', () => {\n      if (!initialState) {\n        setStatus('请先载入地图。', 'err');\n        return;\n      }\n      defaultMappingFromState(initialState);\n      renderMappingControls();\n      renderGrid();\n      setStatus('已按扫描顺序重新建立对应关系。', 'ok');\n    });\n\n    stepBtn.addEventListener('click', () => {\n      if (!state && !loadMap()) return;\n      if (!validateMapping(true)) return;\n      if (path.length === 0) {\n        path = cleanPath(pathInputEl.value);\n        pathInputEl.value = path;\n        updateStats();\n      }\n      if (path.length === 0) {\n        setStatus('路径为空，请输入 U/D/L/R 或 a/b/c/e。', 'err');\n        return;\n      }\n      doOneStep();\n    });\n\n    pauseBtn.addEventListener('click', () => {\n      if (!running) return;\n      paused = !paused;\n      pauseBtn.textContent = paused ? '继续' : '暂停';\n      setStatus(paused ? '已暂停。' : '继续复现。', paused ? 'warn' : 'ok');\n    });\n\n    speedRange.addEventListener('input', () => {\n      speedText.textContent = speedRange.value + 'ms/步';\n      if (running) startTimer();\n    });\n\n    mapTextEl.value = DEFAULT_MAP_TEXT;\n    initialState = makeEmptyState();\n    state = makeEmptyState();\n    updateManualRecordUI();\n    updateManualModeSwitchUI(false);\n    loadMap();\n    renderGrid();\n  <\/script>\n<\/body>\n<\/html>",
      editor: "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>推箱子地图生成器 12×16<\/title>\n  <style>\n    :root {\n      --bg: #f5f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --empty: #60a5fa;\n      --wall: #6b7280;\n      --car: #22c55e;\n      --box: #facc15;\n      --target: #f9a8d4;\n      --bomb: #ef4444;\n      --shadow: 0 12px 32px rgba(15, 23, 42, 0.12);\n    }\n\n    * { box-sizing: border-box; }\n\n    body {\n      margin: 0;\n      min-height: 100vh;\n      font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      background: radial-gradient(circle at top left, #dbeafe, transparent 34%), var(--bg);\n      color: var(--text);\n    }\n\n    .app {\n      max-width: 1180px;\n      margin: 0 auto;\n      padding: 28px 20px 40px;\n    }\n\n    header { margin-bottom: 18px; }\n\n    h1 {\n      margin: 0 0 8px;\n      font-size: 30px;\n      letter-spacing: -0.04em;\n    }\n\n    .subtitle {\n      margin: 0;\n      color: var(--muted);\n      font-size: 15px;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: minmax(560px, 1fr) 380px;\n      gap: 20px;\n      align-items: start;\n    }\n\n    .panel {\n      background: rgba(255, 255, 255, 0.92);\n      border: 1px solid rgba(209, 213, 219, 0.8);\n      border-radius: 22px;\n      box-shadow: var(--shadow);\n      padding: 18px;\n      backdrop-filter: blur(12px);\n    }\n\n    .map-wrap {\n      overflow-x: auto;\n      padding-bottom: 4px;\n    }\n\n    .grid {\n      display: grid;\n      grid-template-columns: repeat(16, 34px);\n      grid-template-rows: repeat(12, 34px);\n      gap: 3px;\n      user-select: none;\n      width: max-content;\n      padding: 8px;\n      border-radius: 18px;\n      background: #e5e7eb;\n      border: 1px solid #cbd5e1;\n    }\n\n    .cell {\n      width: 34px;\n      height: 34px;\n      border: 1px solid rgba(15, 23, 42, 0.18);\n      border-radius: 7px;\n      cursor: pointer;\n      transition: transform 0.08s ease, filter 0.08s ease, outline 0.08s ease;\n    }\n\n    .cell:hover {\n      transform: scale(1.04);\n      filter: brightness(1.05);\n      outline: 2px solid rgba(37, 99, 235, 0.35);\n    }\n\n    .tile-empty { background: var(--empty); }\n    .tile-wall { background: var(--wall); }\n    .tile-car { background: var(--car); }\n    .tile-box { background: var(--box); }\n    .tile-target { background: var(--target); }\n    .tile-bomb { background: var(--bomb); }\n\n    .toolbar-title,\n    .section-title {\n      margin: 0 0 10px;\n      font-size: 16px;\n      font-weight: 800;\n    }\n\n    .palette {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 10px;\n      margin-bottom: 16px;\n    }\n\n    .tool {\n      border: 2px solid transparent;\n      background: #f8fafc;\n      border-radius: 14px;\n      padding: 10px;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      gap: 10px;\n      color: var(--text);\n      font-weight: 700;\n      transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;\n    }\n\n    .tool:hover {\n      transform: translateY(-1px);\n      background: #eef2ff;\n    }\n\n    .tool.active {\n      border-color: #2563eb;\n      background: #dbeafe;\n    }\n\n    .swatch {\n      width: 26px;\n      height: 26px;\n      border-radius: 7px;\n      border: 1px solid rgba(0,0,0,0.18);\n      display: inline-block;\n      flex: 0 0 auto;\n    }\n\n    .swatch.wall { background: var(--wall); }\n    .swatch.car { background: var(--car); }\n    .swatch.box { background: var(--box); }\n    .swatch.target { background: var(--target); }\n    .swatch.bomb { background: var(--bomb); }\n    .swatch.erase { background: var(--empty); }\n\n    .buttons {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px;\n      margin: 12px 0 16px;\n    }\n\n    button {\n      border: 0;\n      border-radius: 12px;\n      padding: 10px 13px;\n      font-weight: 800;\n      cursor: pointer;\n      background: #2563eb;\n      color: white;\n      transition: transform 0.12s ease, opacity 0.12s ease;\n    }\n\n    button:hover {\n      transform: translateY(-1px);\n      opacity: 0.94;\n    }\n\n    button.secondary { background: #475569; }\n    button.danger { background: #dc2626; }\n\n\n    .converter-box {\n      margin-top: 14px;\n      padding: 12px;\n      border: 1px solid #e2e8f0;\n      border-radius: 16px;\n      background: #f8fafc;\n    }\n\n    .converter-box .buttons {\n      margin: 8px 0 0;\n    }\n\n    button.good { background: #16a34a; }\n\n    textarea {\n      width: 100%;\n      min-height: 280px;\n      resize: vertical;\n      border: 1px solid #cbd5e1;\n      border-radius: 16px;\n      padding: 12px;\n      font-family: Consolas, Monaco, \"Courier New\", monospace;\n      font-size: 14px;\n      line-height: 1.55;\n      outline: none;\n      color: #111827;\n      background: #f8fafc;\n    }\n\n    textarea:focus {\n      border-color: #2563eb;\n      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);\n    }\n\n    .status {\n      min-height: 22px;\n      margin: 8px 0 0;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .status.ok { color: #15803d; }\n    .status.err { color: #dc2626; }\n\n    .hint {\n      margin: 10px 0 0;\n      color: var(--muted);\n      font-size: 13px;\n      line-height: 1.6;\n    }\n\n    .legend {\n      display: grid;\n      grid-template-columns: repeat(6, max-content);\n      gap: 8px 12px;\n      align-items: center;\n      margin: 14px 0 0;\n      color: var(--muted);\n      font-size: 13px;\n    }\n\n    .legend-item {\n      display: inline-flex;\n      align-items: center;\n      gap: 5px;\n    }\n\n    .mini {\n      width: 15px;\n      height: 15px;\n      border-radius: 4px;\n      border: 1px solid rgba(0,0,0,0.15);\n    }\n\n    @media (max-width: 980px) {\n      .layout { grid-template-columns: 1fr; }\n      .grid {\n        grid-template-columns: repeat(16, 30px);\n        grid-template-rows: repeat(12, 30px);\n      }\n      .cell {\n        width: 30px;\n        height: 30px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <main class=\"app\">\n    <header>\n      <h1>推箱子地图生成器<\/h1>\n      <p class=\"subtitle\">12 行 × 16 列；默认外圈墙块，内部空地。点击元素后在地图上放置，也可以粘贴文本地图后点击“输入地图”导入。<\/p>\n    <\/header>\n\n    <section class=\"layout\">\n      <div class=\"panel\">\n        <div class=\"map-wrap\">\n          <div id=\"grid\" class=\"grid\" aria-label=\"12行16列地图编辑区\"><\/div>\n        <\/div>\n        <div class=\"legend\">\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--wall)\"><\/i># 墙<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--car)\"><\/i>@ 车<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--box)\"><\/i>$ 箱<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--target)\"><\/i>. 目标<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--bomb)\"><\/i>* 炸弹<\/span>\n          <span class=\"legend-item\"><i class=\"mini\" style=\"background: var(--empty)\"><\/i>- 空地<\/span>\n        <\/div>\n        <p class=\"hint\">小技巧：按住鼠标拖动可以连续刷格子；选择“删除/空地”后点击格子即可清除元素。<\/p>\n      <\/div>\n\n      <aside class=\"panel\">\n        <p class=\"toolbar-title\">物品栏<\/p>\n        <div id=\"palette\" class=\"palette\"><\/div>\n\n        <p class=\"section-title\">地图文本窗口<\/p>\n        <div class=\"buttons\">\n          <button id=\"exportBtn\">输出地图<\/button>\n          <button id=\"copyBtn\" class=\"secondary\">复制文本<\/button>\n          <button id=\"importBtn\" class=\"secondary\">输入地图<\/button>\n          <button id=\"resetBtn\" class=\"danger\">重置地图<\/button>\n        <\/div>\n        <textarea id=\"mapText\" spellcheck=\"false\" placeholder=\"点击“输出地图”生成文本；也可以在这里粘贴 12×16 的地图文本，然后点击“输入地图”导入。空格会被视为空地。\"><\/textarea>\n\n        <div class=\"converter-box\">\n          <p class=\"section-title\">地图格式转换<\/p>\n          <div class=\"buttons\">\n            <button id=\"toQuotedBtn\" class=\"good\">转为引号逗号格式<\/button>\n            <button id=\"toPlainBtn\" class=\"secondary\">转为纯换行格式<\/button>\n            <button id=\"autoConvertBtn\" class=\"secondary\">自动互转<\/button>\n          <\/div>\n          <p class=\"hint\">可把 12 行纯地图转换为 <code>\"...\",<\/code> 格式，也可以把带引号和逗号的格式转换回纯换行格式。<\/p>\n        <\/div>\n\n        <p id=\"status\" class=\"status\">当前工具：墙块<\/p>\n        <p class=\"hint\">支持带引号和逗号的 C 数组格式，也支持 12 行纯地图字符；输入中的空格会按空地处理。<\/p>\n      <\/aside>\n    <\/section>\n  <\/main>\n\n  <script>\n    const ROWS = 12;\n    const COLS = 16;\n\n    const tiles = {\n      '#': { key: '#', name: '墙块', className: 'tile-wall', swatch: 'wall' },\n      '@': { key: '@', name: '车', className: 'tile-car', swatch: 'car' },\n      '$': { key: '$', name: '箱子', className: 'tile-box', swatch: 'box' },\n      '.': { key: '.', name: '目标点', className: 'tile-target', swatch: 'target' },\n      '*': { key: '*', name: '炸弹', className: 'tile-bomb', swatch: 'bomb' },\n      '-': { key: '-', name: '删除/空地', className: 'tile-empty', swatch: 'erase' }\n    };\n\n    const gridEl = document.getElementById('grid');\n    const paletteEl = document.getElementById('palette');\n    const textEl = document.getElementById('mapText');\n    const statusEl = document.getElementById('status');\n    const exportBtn = document.getElementById('exportBtn');\n    const copyBtn = document.getElementById('copyBtn');\n    const importBtn = document.getElementById('importBtn');\n    const resetBtn = document.getElementById('resetBtn');\n    const toQuotedBtn = document.getElementById('toQuotedBtn');\n    const toPlainBtn = document.getElementById('toPlainBtn');\n    const autoConvertBtn = document.getElementById('autoConvertBtn');\n\n    let map = [];\n    let currentTool = '#';\n    let isMouseDown = false;\n\n    function makeDefaultMap() {\n      const result = [];\n      for (let r = 0; r < ROWS; r++) {\n        const row = [];\n        for (let c = 0; c < COLS; c++) {\n          row.push(r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1 ? '#' : '-');\n        }\n        result.push(row);\n      }\n      return result;\n    }\n\n    function renderPalette() {\n      paletteEl.innerHTML = '';\n      Object.keys(tiles).forEach(key => {\n        const tile = tiles[key];\n        const btn = document.createElement('button');\n        btn.type = 'button';\n        btn.className = 'tool' + (key === currentTool ? ' active' : '');\n        btn.innerHTML = '<span class=\"swatch ' + tile.swatch + '\"><\/span><span>' + tile.name + '<\/span>';\n        btn.addEventListener('click', () => {\n          currentTool = key;\n          renderPalette();\n          setStatus('当前工具：' + tile.name, '');\n        });\n        paletteEl.appendChild(btn);\n      });\n    }\n\n    function renderGrid() {\n      gridEl.innerHTML = '';\n      for (let r = 0; r < ROWS; r++) {\n        for (let c = 0; c < COLS; c++) {\n          const ch = map[r][c];\n          const tile = tiles[ch] || tiles['-'];\n          const cell = document.createElement('div');\n          cell.className = 'cell ' + tile.className;\n          cell.title = '第 ' + (r + 1) + ' 行，第 ' + (c + 1) + ' 列：' + tile.name;\n          cell.addEventListener('mousedown', (event) => {\n            event.preventDefault();\n            isMouseDown = true;\n            placeTile(r, c);\n          });\n          cell.addEventListener('mouseenter', () => {\n            if (isMouseDown) placeTile(r, c);\n          });\n          gridEl.appendChild(cell);\n        }\n      }\n    }\n\n    function placeTile(r, c) {\n      if (currentTool === '@') {\n        for (let i = 0; i < ROWS; i++) {\n          for (let j = 0; j < COLS; j++) {\n            if (map[i][j] === '@') map[i][j] = '-';\n          }\n        }\n      }\n\n      map[r][c] = currentTool;\n      renderGrid();\n      setStatus('已放置：' + tiles[currentTool].name + '，位置 (' + (r + 1) + ', ' + (c + 1) + ')', 'ok');\n    }\n\n    function currentMapLines() {\n      return map.map(row => row.join(''));\n    }\n\n    function linesToQuotedText(lines) {\n      return lines.map(line => '\"' + line + '\",').join(String.fromCharCode(10));\n    }\n\n    function linesToPlainText(lines) {\n      return lines.join(String.fromCharCode(10));\n    }\n\n    function mapToText() {\n      return map.map(row => '        \"' + row.join('') + '\",').join(String.fromCharCode(10));\n    }\n\n    function exportMap() {\n      textEl.value = mapToText();\n      setStatus('已生成地图文本，可以直接复制。', 'ok');\n    }\n\n    function setStatus(message, type) {\n      statusEl.textContent = message;\n      statusEl.className = 'status' + (type ? ' ' + type : '');\n    }\n\n    function normalizeMapLine(line) {\n      const trimmed = line.trim();\n\n      const doubleStart = trimmed.indexOf('\"');\n      const doubleEnd = trimmed.lastIndexOf('\"');\n      if (doubleStart !== -1 && doubleEnd > doubleStart) {\n        return trimmed.slice(doubleStart + 1, doubleEnd).replaceAll(' ', '-');\n      }\n\n      const singleStart = trimmed.indexOf(\"'\");\n      const singleEnd = trimmed.lastIndexOf(\"'\");\n      if (singleStart !== -1 && singleEnd > singleStart) {\n        return trimmed.slice(singleStart + 1, singleEnd).replaceAll(' ', '-');\n      }\n\n      if (line.length === COLS) {\n        return line.replaceAll(' ', '-');\n      }\n\n      return trimmed.replaceAll(' ', '-');\n    }\n\n    function isValidMapLine(line) {\n      if (line.length !== COLS) return false;\n      for (let i = 0; i < line.length; i++) {\n        if (!'#@$.-*'.includes(line[i])) return false;\n      }\n      return true;\n    }\n\n    function parseMapText(raw) {\n      const text = raw.replaceAll(String.fromCharCode(13), '');\n      const lines = text.split(String.fromCharCode(10));\n      const extracted = [];\n\n      for (const line of lines) {\n        if (line.trim().length === 0) continue;\n        const candidate = normalizeMapLine(line);\n        if (isValidMapLine(candidate)) {\n          extracted.push(candidate);\n        }\n      }\n\n      if (extracted.length !== ROWS) {\n        return { ok: false, error: '需要识别到 ' + ROWS + ' 行地图，目前识别到 ' + extracted.length + ' 行。' };\n      }\n\n      const result = [];\n      for (let r = 0; r < ROWS; r++) {\n        result.push(extracted[r].split(''));\n      }\n\n      return { ok: true, data: result };\n    }\n\n    function importFromTextarea() {\n      const raw = textEl.value;\n      if (raw.trim().length === 0) {\n        setStatus('请输入地图文本后再点击“输入地图”。', 'err');\n        return;\n      }\n\n      const result = parseMapText(raw);\n      if (!result.ok) {\n        setStatus(result.error, 'err');\n        return;\n      }\n\n      map = result.data;\n      renderGrid();\n      setStatus('已识别并导入地图。', 'ok');\n    }\n\n    function getTextareaMapLinesOrCurrentMap() {\n      const raw = textEl.value;\n      if (raw.trim().length === 0) {\n        return { ok: true, lines: currentMapLines(), fromCurrentMap: true };\n      }\n\n      const result = parseMapText(raw);\n      if (!result.ok) return result;\n      return { ok: true, lines: result.data.map(row => row.join('')), fromCurrentMap: false };\n    }\n\n    function looksLikeQuotedFormat(raw) {\n      const lines = raw.replaceAll(String.fromCharCode(13), '').split(String.fromCharCode(10));\n      for (const line of lines) {\n        const trimmed = line.trim();\n        if (trimmed.length === 0) continue;\n        if (trimmed.includes('\"') || trimmed.includes(\"'\")) return true;\n      }\n      return false;\n    }\n\n    function convertMapFormat(format) {\n      const result = getTextareaMapLinesOrCurrentMap();\n      if (!result.ok) {\n        setStatus(result.error + ' 请确认文本中包含完整的 12 行 × 16 列地图。', 'err');\n        return;\n      }\n\n      if (format === 'quoted') {\n        textEl.value = linesToQuotedText(result.lines);\n        setStatus('已转换为引号逗号格式。', 'ok');\n      } else {\n        textEl.value = linesToPlainText(result.lines);\n        setStatus('已转换为纯换行格式。', 'ok');\n      }\n    }\n\n    function autoConvertMapFormat() {\n      const raw = textEl.value;\n      if (raw.trim().length === 0) {\n        convertMapFormat('quoted');\n        return;\n      }\n      convertMapFormat(looksLikeQuotedFormat(raw) ? 'plain' : 'quoted');\n    }\n\n    document.addEventListener('mouseup', () => {\n      isMouseDown = false;\n    });\n\n    exportBtn.addEventListener('click', exportMap);\n\n    copyBtn.addEventListener('click', async () => {\n      if (textEl.value.trim().length === 0) exportMap();\n      textEl.select();\n      try {\n        await navigator.clipboard.writeText(textEl.value);\n        setStatus('已复制到剪贴板。', 'ok');\n      } catch (err) {\n        document.execCommand('copy');\n        setStatus('已尝试复制；如果浏览器拦截，请手动 Ctrl+C。', 'ok');\n      }\n    });\n\n    importBtn.addEventListener('click', importFromTextarea);\n    toQuotedBtn.addEventListener('click', () => convertMapFormat('quoted'));\n    toPlainBtn.addEventListener('click', () => convertMapFormat('plain'));\n    autoConvertBtn.addEventListener('click', autoConvertMapFormat);\n\n    resetBtn.addEventListener('click', () => {\n      map = makeDefaultMap();\n      renderGrid();\n      exportMap();\n      setStatus('已重置为默认地图：外圈墙块，内部空地。', 'ok');\n    });\n\n    map = makeDefaultMap();\n    renderPalette();\n    renderGrid();\n    exportMap();\n  <\/script>\n<\/body>\n<\/html>\n"
    };

    const frames = {
      replay: document.getElementById('replayFrame'),
      editor: document.getElementById('editorFrame')
    };

    const buttons = {
      replay: document.getElementById('showReplayBtn'),
      editor: document.getElementById('showEditorBtn')
    };

    let currentPage = 'replay';

    function loadEmbeddedPages() {
      frames.replay.srcdoc = embeddedPages.replay;
      frames.editor.srcdoc = embeddedPages.editor;
    }

    function switchPage(page) {
      if (!frames[page]) return;
      currentPage = page;

      for (const key of Object.keys(frames)) {
        const active = key === page;
        frames[key].classList.toggle('active', active);
        buttons[key].classList.toggle('active', active);
        frames[key].setAttribute('aria-hidden', active ? 'false' : 'true');
      }

      setTimeout(() => {
        try {
          frames[page].contentWindow.focus();
        } catch (err) {}
      }, 0);
    }

    function reloadCurrentPage() {
      if (!frames[currentPage]) return;
      frames[currentPage].srcdoc = embeddedPages[currentPage];
      setTimeout(() => switchPage(currentPage), 0);
    }

    buttons.replay.addEventListener('click', () => switchPage('replay'));
    buttons.editor.addEventListener('click', () => switchPage('editor'));
    document.getElementById('reloadCurrentBtn').addEventListener('click', reloadCurrentPage);

    loadEmbeddedPages();
    switchPage('replay');
  </script>
</body>
</html>
